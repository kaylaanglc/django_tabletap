<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}TableTap{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-blue-600 text-white py-4 px-6 flex justify-between items-center">
    <h1 class="text-xl font-semibold">
      {% if user.is_authenticated %}
        <a href="{% url 'dashboard' %}" class="hover:underline">TableTap Owner Dashboard</a>
      {% else %}
        <a href="{% url 'home' %}" class="hover:underline">TableTap</a>
      {% endif %}
    </h1>     

    <nav class="flex gap-6 items-center text-sm">
      {% if user.is_authenticated %}
        <a href="{% url 'dashboard' %}" class="underline">Home</a>
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button type="submit" class="underline bg-transparent border-none text-white hover:underline cursor-pointer">
            Logout
          </button>
        </form>
      {% else %}
        <a href="{% url 'login' %}" class="underline">Login</a>
        <a href="{% url 'signup' %}" class="underline">Sign Up</a>
      {% endif %}
    </nav>
  </header>

  <!-- Main content -->
  <main class="flex-1 p-6">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t py-4 text-center text-sm text-gray-500">
    &copy; 2025 TableTap. All rights reserved.
  </footer>

</body>
</html>
