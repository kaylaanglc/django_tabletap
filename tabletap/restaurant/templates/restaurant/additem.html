{% extends "core/base.html" %}

{% block title %}{{ title }} | TableTap{% endblock %}

{% block content %}
<main class="flex-1 flex items-center justify-center px-4 py-12 bg-gray-100 min-h-screen">
  <div class="max-w-2xl w-full bg-white p-6 rounded shadow">
    <h2 class="text-xl font-bold mb-4 text-center text-blue-600">{{ title }}</h2>
    <form action="" method="POST" class="grid gap-4">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="flex justify-between items-center mt-4">
        <a href="{% url 'menu' %}" class="text-blue-600 hover:underline">← Back to Menu</a>
        <button type="submit" class="bg-blue-600 text-white py-2 px-4 rounded hover:bg-blue-700 transition">
          Save Item
        </button>
      </div>
    </form>
  </div>
</main>
{% endblock %}
